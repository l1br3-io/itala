[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "MPL-2.0", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl-sys", reason = "use rustls" },
    { name = "chrono",      reason = "use time"   },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
