[licenses]
version = 2
# BSD-2-Clause: arrayref (blake3 dep) + comrak — both OSI-approved, FSF Free/Libre.
# Unicode-DFS-2016: finl_unicode (comrak dep) — OSI-approved Unicode data-files license.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl-sys", reason = "use rustls" },
    { name = "chrono",      reason = "use time"   },
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
