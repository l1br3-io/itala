# Claude Code Configuration
# Project profile for Itala — a cross-platform, plugin-based knowledge-management system.

project:
  name: itala
  description: Cross-platform, plugin-based knowledge management system
  url: https://github.com/kulapoo/itala

# Agent defaults
agents:
  default_model: claude-sonnet-4-6
  planning_model: claude-opus-4-7
  temperature: 0.7

# Repository layout (these paths come into existence as the workspace materializes;
# they reflect the structure documented in docs/ARCHITECTURE.md §3.3).
paths:
  workspace_root: ./
  crates: crates/
  apps: apps/
  plugins: plugins/
  docs: docs/

# Canonical commands
commands:
  fmt: cargo fmt --all
  lint: cargo clippy --workspace --all-targets --all-features -- -D warnings
  test: cargo nextest run --workspace
  doctest: cargo test --doc --workspace
  build: cargo build --workspace
  build_release: cargo build --workspace --release
  deny: cargo deny check
  audit: cargo audit
  doc: cargo doc --no-deps --workspace
  desktop_dev: pnpm --filter desktop dev

# Performance targets (from docs/ARCHITECTURE.md §4.1)
performance:
  cold_start_desktop_ms: 500
  cold_start_mobile_ms: 1000
  open_note_10kb_ms: 50
  search_10k_notes_ms: 200
  keystroke_to_screen_ms: 16
  kernel_memory_mb: 20

# Tech stack
stack:
  kernel:
    - rust
    - tokio
    - serde
    - thiserror
    - tracing
    - ulid
    - blake3
    - camino
  storage:
    - redb
    - opendal
  editor:
    - yrs (Y-CRDT)
    - comrak (Markdown)
    - codemirror-6 (TS, inside webview)
  search:
    - tantivy
  plugins:
    - wasmtime (component model)
    - wit-bindgen
  shells:
    - tauri-2 (desktop, mobile)
    - wasm32-wasip2 (web target)
    - clap (CLI)
  ai:
    - candle / ort (local embeddings)
    - ollama-rs (local LLM)
    - async-openai
    - anthropic-sdk-rs
  webview:
    - typescript
    - codemirror-6
    - solidjs (or sveltekit) — thin shell only
    - vite

# Hooks (configured in .claude/hooks/*.js)
hooks:
  pre_commit:
    - Run security checks
    - Run cargo clippy on staged .rs files
    - Run formatter check
  post_edit:
    - Run cargo fmt on .rs files
    - Run prettier/biome on .ts/.tsx files
  quality_gate:
    - Format check by extension (.rs, .ts, .tsx, .js, .jsx, .json, .md, .py, .go)

# Rules and standards (loaded by Rust-touching agents)
standards:
  - rules/workflow.md
  - rules/api-design.md
  - rules/security.md
  - rules/code-style.md
  - rules/rust/workspace.md
  - rules/rust/error-handling.md
  - rules/rust/async.md
  - rules/rust/api-design.md
  - rules/rust/testing.md
  - rules/rust/security.md
  - rules/rust/wasm-plugins.md
  - rules/rust/tooling.md
  - rules/rust/ownership-and-lifetimes.md
  - rules/rust/traits-and-dispatch.md
  - rules/rust/unsafe-and-ffi.md
  - rules/typescript/coding-style.md
  - rules/typescript/patterns.md
  - rules/typescript/testing.md
  - rules/typescript/security.md
  - rules/typescript/hooks.md

# Documentation
docs:
  vision: docs/VISION.md
  product: docs/PRODUCT.md
  roadmap: docs/ROADMAP.md
  architecture: docs/ARCHITECTURE.md
  entry: CLAUDE.md

# Security
security:
  rules:
    - rules/security.md
    - rules/rust/security.md
    - rules/typescript/security.md
  checklist:
    - "#![forbid(unsafe_code)] at every Rust crate root unless justified"
    - No hardcoded secrets; secrets via keyring-rs
    - Plugin capability tokens enforced at host call boundary
    - Tauri capabilities follow default-deny
    - cargo deny check + cargo audit pass
    - Rate limits at AI provider boundary
    - Input validation at every external boundary (file, network, plugin, IPC)
