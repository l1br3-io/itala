[package]
name = "itala-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "itala"
path = "src/main.rs"

[dependencies]
itala-kernel = { workspace = true }
itala-vault  = { workspace = true }
anyhow       = { workspace = true }
clap         = { workspace = true, features = ["derive"] }
camino       = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "signal", "io-std", "io-util"] }
tokio-util   = { workspace = true }
tokio-stream = { workspace = true }
futures      = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile   = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time"] }

[lints]
workspace = true
