[package]
name = "itala-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Itala CLI shell (MVP-α)"

[[bin]]
name = "itala"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
itala-kernel.workspace = true
itala-vault.workspace = true
itala-note.workspace = true
itala-store-files.workspace = true
itala-vfs-fs.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
anyhow.workspace = true
camino.workspace = true
bytes.workspace = true
tracing.workspace = true
time.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
itala-kernel = { workspace = true, features = ["test-support"] }