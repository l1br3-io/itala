name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      # Gate 1
      - name: fmt
        run: cargo fmt --all -- --check

      # Gate 2
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Gate 3
      - name: nextest
        run: cargo nextest run --workspace --no-tests=pass

      # Gate 4
      - name: doctest
        run: cargo test --doc --workspace

      # Gate 5
      - name: deny
        run: cargo deny check

      # Gate 6
      - name: doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

  # Cross-platform watcher tests — runs on macOS and Windows when the adapter
  # source changes to verify OS-level filesystem events fire correctly.
  watcher:
    name: Watcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Watcher integration tests
        run: cargo nextest run -p itala-vault --test local_fs_vfs
